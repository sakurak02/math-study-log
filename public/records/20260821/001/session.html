<style>
:root {
  --bg: #fbfcfc;
  --panel: #ffffff;
  --line: #dfe7e7;
  --ink: #192323;
  --ink-soft: #6b7777;
  --accent: #315f63;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans JP", sans-serif;
  line-height: 1.7;
}

header {
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
}

.header-inner,
main {
  width: min(900px, calc(100% - 32px));
  margin: 0 auto;
}

.header-inner {
  padding: 22px 0 16px;
}

.page-kicker,
.page-date,
.record-number {
  font-family: "JetBrains Mono", monospace;
}

.page-kicker {
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
}

h1 {
  margin-top: 3px;
  font-size: 24px;
  line-height: 1.45;
}

.page-date {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 11px;
  letter-spacing: 0.06em;
}

main {
  min-height: calc(100vh - 164px);
  padding: 24px 0 42px;
}

.page-actions,
.record-links,
.day-navigation {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.page-actions {
  margin-bottom: 24px;
}

.text-link {
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--accent);
  text-decoration: none;
  font: 600 11px/1.3 "JetBrains Mono", monospace;
}

.text-link:hover {
  border-color: var(--accent);
}

.record-list {
  border-top: 1px solid var(--line);
}

.record-item {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 18px 2px;
  border-bottom: 1px solid var(--line);
}

.record-number {
  color: var(--ink-soft);
  font-size: 12px;
}

.record-title {
  font-size: 15px;
  font-weight: 600;
}

.record-links .text-link {
  min-height: 32px;
}

.day-navigation {
  justify-content: space-between;
  margin-top: 24px;
}

.session-shell {
  min-height: 160px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.move-notice {
  padding: 28px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 14px;
}

.move-notice .text-link {
  margin-top: 16px;
}

footer {
  border-top: 1px solid var(--line);
  padding: 18px 24px;
  background: var(--panel);
  color: var(--ink-soft);
  text-align: center;
  font-size: 11px;
}

@media (max-width: 600px) {
  .header-inner,
  main {
    width: calc(100% - 24px);
  }

  .header-inner {
    padding: 17px 0 13px;
  }

  h1 {
    font-size: 21px;
  }

  main {
    padding-top: 19px;
  }

  .record-item {
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 16px 1px;
  }
}
