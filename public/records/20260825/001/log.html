<style>

header {
  border-bottom: 1px solid var(--line);

  background: rgba(255, 255, 255, 0.9);

main,
footer {
  width: min(900px, calc(100% - 32px));

.eyebrow {

  font-weight: 700;
  letter-spacing: -0.025em;

.meta {
  display: inline-flex;

  border-radius: 999px;

  color: var(--green-dark);

}

main {
  padding: 24px 0 34px;
}

.page-links {

  display: grid;

  border-radius: 6px;

  cursor: zoom-in;
  transition:
    transform 0.15s ease,
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

.sheet:hover {
  transform: translateY(-1px);
  border-color: #b8cdbf;
  box-shadow: 0 5px 15px rgba(27, 49, 35, 0.07);
}

.sheet-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--ink-soft);
  padding-left: 2px;
}

.nav-section {
  margin-top: 28px;
  padding: 14px 14px 0;
  border-top: 1px solid var(--line);
  border-radius: 8px 8px 0 0;
  background: linear-gradient(
    180deg,
    rgba(228, 239, 232, 0.62),
    rgba(228, 239, 232, 0)
  );
}

.nav-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 14px;
}

.nav-link {
  color: var(--green-dark);
  text-decoration: none;
  font-size: 12px;
}

.nav-link:hover {
  text-decoration: underline;
}

.nav-link.next {

}

.nav-center {

  text-decoration: none;
  font-size: 11px;
}

.nav-center:hover {

}

footer {
  margin-top: 6px;
  padding: 15px 0 20px;
  border-top: 1px solid var(--line);
  font-size: 10px;
  color: var(--ink-soft);
  background: var(--paper);
}

/* 画像拡大 */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(12, 20, 15, 0.82);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 20;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 94vw;
  max-height: 92vh;
  width: auto;
  height: auto;
  border-radius: 8px;
  background: #fff;
  cursor: zoom-out;
}

@media (max-width: 650px) {
  header {

<header>

    <div class="meta">2026.08.25</div>
  </div>
</header>

<main>

  <nav class="page-links" aria-label="ページメニュー">
    <a class="back-link" href="../../../index.html">TOP</a>
    <a class="back-link" href="./session.html" target="_blank" rel="noopener noreferrer">SESSION ↗</a>
  </nav>

  <section class="study-grid">

    <div class="study-item">
      <img
        class="sheet"
        src="./images/20260825-001-f.jpg"
        alt="2026.08.25 学習記録 画像1"
        onclick="openLightbox(this)"
      >
    </div>

    <div class="study-item">
      <img
        class="sheet"
        src="./images/20260825-001-r.jpg"
        alt="2026.08.25 学習記録 画像2"
        onclick="openLightbox(this)"
      >
    </div>
  </section>

</main>

<footer>
  Math Study Log © 2026
</footer>

<div
  class="lightbox"
  id="lightbox"
  onclick="closeLightbox()"
>
  <img
    id="lightboxImage"
    src=""
    alt=""
  >
</div>

<script>
function openLightbox(element) {
  const image =
    document.getElementById("lightboxImage");

  image.src = element.src;
  image.alt = element.alt;

  document
    .getElementById("lightbox")
    .classList
    .add("open");
}

function closeLightbox() {
  document
    .getElementById("lightbox")
    .classList
    .remove("open");
}

document.addEventListener(
  "keydown",
  (event) => {
    if (event.key === "Escape") {
      closeLightbox();
    }
  }
);
</script>
