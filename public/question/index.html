<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUESTION | 数学学習記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfcfc;
  --panel: #ffffff;
  --line: #dfe7e7;
  --ink: #192323;
  --ink-soft: #6b7777;
  --accent: #315f63;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans JP", sans-serif;
  line-height: 1.7;
}
header {
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
}
.header-inner {
  max-width: 940px;
  margin: 0 auto;
  padding: 18px 24px;
}
.brand-kicker {
  font: 600 11px/1.3 "JetBrains Mono", monospace;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
}
.brand-title { font-size: 21px; font-weight: 700; }
main {
  max-width: 940px;
  min-height: calc(100vh - 155px);
  margin: 0 auto;
  padding: 28px 24px 48px;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 26px;
}
.page-kicker {
  font: 600 12px/1.3 "JetBrains Mono", monospace;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.top-link {
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  padding: 6px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  text-decoration: none;
  font: 600 11px/1.3 "JetBrains Mono", monospace;
}
.top-link:hover { border-color: var(--accent); }
.list { border-top: 1px solid var(--line); }
.item {
  display: block;
  padding: 16px 2px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
}
.item:hover .title { color: var(--accent); }
.title { font-size: 15px; font-weight: 600; }
footer {
  border-top: 1px solid var(--line);
  padding: 18px 24px;
  color: var(--ink-soft);
  text-align: center;
  font-size: 11px;
}
@media (max-width: 600px) {
  .header-inner { padding: 15px 14px; }
  main { padding: 22px 12px 36px; }
  .item { padding: 14px 1px; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand-kicker">MATH STUDY LOG</div>
    <div class="brand-title">数学学習記録</div>
  </div>
</header>
<main>
  <div class="page-head">
    <div class="page-kicker">QUESTION</div>
    <a class="top-link" href="../index.html">TOP</a>
  </div>
  <div class="list" aria-label="QUESTION一覧">
    <!--
    <a class="item" href="記事へのパス">
      <div class="title">自由な数学の疑問</div>
    </a>
    -->
  </div>
</main>
<footer>Math Study Log © 2026</footer>
</body>
</html>
